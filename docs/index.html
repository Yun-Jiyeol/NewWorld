<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | NewWorld</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">NewWorld</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/docs.loader.js";
      var config = {
        dataUrl: buildUrl + "/docs.data.split",
        frameworkUrl: buildUrl + "/docs.framework.js.unityweb",
        codeUrl: buildUrl + "/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "NewWorld",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // ------------------------------------------------------------
      // Split Unity data file bridge for GitHub Pages.
      //
      // GitHub blocks files larger than 100 MiB (and browser uploads
      // are limited to 25 MiB per file). The original Unity data file
      // is therefore stored as multiple ~20 MiB parts.
      //
      // Unity still requests one virtual data URL. This fetch wrapper
      // streams the part files in order and returns them as one Response,
      // so the generated Unity loader receives exactly the original bytes.
      // ------------------------------------------------------------
      const unitySplitDataUrl = new URL(
        buildUrl + "/docs.data.split",
        document.baseURI
      ).href;

      const unitySplitDataParts = [
        { url: buildUrl + "/docs.data.part00.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part01.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part02.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part03.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part04.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part05.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part06.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part07.unityweb", size: 8490893 }
      ];

      const unitySplitDataTotalSize = 155291533;
      const unityNativeFetch = window.fetch.bind(window);

      window.fetch = async function(input, init) {
        const requestUrl =
          typeof input === "string"
            ? input
            : input.url;

        const absoluteRequestUrl =
          new URL(requestUrl, document.baseURI).href;

        if (absoluteRequestUrl !== unitySplitDataUrl) {
          return unityNativeFetch(input, init);
        }

        const method = (
          (init && init.method) ||
          (typeof input !== "string" && input.method) ||
          "GET"
        ).toUpperCase();

        if (method === "HEAD") {
          return new Response(null, {
            status: 200,
            headers: {
              "Content-Type": "application/octet-stream",
              "Content-Length": String(unitySplitDataTotalSize)
            }
          });
        }

        const stream = new ReadableStream({
          async start(controller) {
            try {
              for (const part of unitySplitDataParts) {
                const response =
                  await unityNativeFetch(part.url, {
                    cache: "default"
                  });

                if (!response.ok) {
                  throw new Error(
                    "Failed to download Unity data part: " +
                    part.url +
                    " (" + response.status + ")"
                  );
                }

                if (response.body &&
                    typeof response.body.getReader === "function") {
                  const reader = response.body.getReader();

                  while (true) {
                    const result = await reader.read();

                    if (result.done)
                      break;

                    controller.enqueue(result.value);
                  }
                }
                else {
                  controller.enqueue(
                    new Uint8Array(
                      await response.arrayBuffer()
                    )
                  );
                }
              }

              controller.close();
            }
            catch (error) {
              controller.error(error);
            }
          }
        });

        return new Response(stream, {
          status: 200,
          headers: {
            "Content-Type": "application/octet-stream",
            "Content-Length": String(unitySplitDataTotalSize)
          }
        });
      };

      // Disable Unity's IndexedDB cache only for the virtual split URL.
      // The individual part requests can still use the normal browser cache.
      config.cacheControl = function(url) {
        return url === config.dataUrl
          ? "no-store"
          : "must-revalidate";
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        // Desktop:
        // Keep the visible WebGL canvas at 16:9 and use as much of the
        // browser viewport as possible, up to 1920x1080.
        //
        // Unity's default matchWebGLToCanvasSize behavior keeps the
        // WebGL render target matched to this CSS size (and devicePixelRatio),
        // preventing a small 960x600 render from being stretched larger.
        function resizeUnityCanvas() {
          const footerHeight = 38;
          const maxWidth = 1920;
          const maxHeight = 1080;

          const availableWidth = window.innerWidth;
          const availableHeight = Math.max(
            1,
            window.innerHeight - footerHeight
          );

          const scale = Math.min(
            availableWidth / maxWidth,
            availableHeight / maxHeight,
            1
          );

          const width = Math.floor(maxWidth * scale);
          const height = Math.floor(maxHeight * scale);

          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
        }

        resizeUnityCanvas();
        window.addEventListener("resize", resizeUnityCanvas);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
