<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | NewWorld</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231F20;
      }

      #unity-container.unity-desktop {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #unity-canvas {
        display: block;
      }

      #unity-footer {
        height: 38px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">NewWorld</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/docs.loader.js";
      var config = {
        dataUrl: buildUrl + "/docs.data.split",
        frameworkUrl: buildUrl + "/docs.framework.js.unityweb",
        codeUrl: buildUrl + "/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "NewWorld",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // ------------------------------------------------------------
      // Split Unity data file bridge for GitHub Pages.
      //
      // GitHub blocks files larger than 100 MiB (and browser uploads
      // are limited to 25 MiB per file). The original Unity data file
      // is therefore stored as multiple ~20 MiB parts.
      //
      // Unity still requests one virtual data URL. This fetch wrapper
      // streams the part files in order and returns them as one Response,
      // so the generated Unity loader receives exactly the original bytes.
      // ------------------------------------------------------------
      const unitySplitDataUrl = new URL(
        buildUrl + "/docs.data.split",
        document.baseURI
      ).href;

      const unitySplitDataParts = [
        { url: buildUrl + "/docs.data.part00.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part01.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part02.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part03.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part04.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part05.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part06.unityweb", size: 20971520 },
        { url: buildUrl + "/docs.data.part07.unityweb", size: 8490893 }
      ];

      const unitySplitDataTotalSize = 155291533;
      const unityNativeFetch = window.fetch.bind(window);

      window.fetch = async function(input, init) {
        const requestUrl =
          typeof input === "string"
            ? input
            : input.url;

        const absoluteRequestUrl =
          new URL(requestUrl, document.baseURI).href;

        if (absoluteRequestUrl !== unitySplitDataUrl) {
          return unityNativeFetch(input, init);
        }

        const method = (
          (init && init.method) ||
          (typeof input !== "string" && input.method) ||
          "GET"
        ).toUpperCase();

        if (method === "HEAD") {
          return new Response(null, {
            status: 200,
            headers: {
              "Content-Type": "application/octet-stream",
              "Content-Length": String(unitySplitDataTotalSize)
            }
          });
        }

        const stream = new ReadableStream({
          async start(controller) {
            try {
              for (const part of unitySplitDataParts) {
                const response =
                  await unityNativeFetch(part.url, {
                    cache: "default"
                  });

                if (!response.ok) {
                  throw new Error(
                    "Failed to download Unity data part: " +
                    part.url +
                    " (" + response.status + ")"
                  );
                }

                if (response.body &&
                    typeof response.body.getReader === "function") {
                  const reader = response.body.getReader();

                  while (true) {
                    const result = await reader.read();

                    if (result.done)
                      break;

                    controller.enqueue(result.value);
                  }
                }
                else {
                  controller.enqueue(
                    new Uint8Array(
                      await response.arrayBuffer()
                    )
                  );
                }
              }

              controller.close();
            }
            catch (error) {
              controller.error(error);
            }
          }
        });

        return new Response(stream, {
          status: 200,
          headers: {
            "Content-Type": "application/octet-stream",
            "Content-Length": String(unitySplitDataTotalSize)
          }
        });
      };

      // Disable Unity's IndexedDB cache only for the virtual split URL.
      // The individual part requests can still use the normal browser cache.
      config.cacheControl = function(url) {
        return url === config.dataUrl
          ? "no-store"
          : "must-revalidate";
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // WebGL에서는 게임 내부 Screen.SetResolution() 값을 상한으로 사용하고,
      // 브라우저보다 큰 해상도는 현재 브라우저 영역까지만 렌더링한다.
      config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        // Desktop WebGL resolution policy
        //
        // 1) Unity의 Screen.SetResolution()으로 선택한 해상도를 "원하는 최대 크기"로 사용.
        // 2) 선택 해상도가 브라우저보다 작으면 확대하지 않고 그대로 표시.
        // 3) 선택 해상도가 브라우저보다 크면 브라우저 안에 들어오는 최대 크기로만 축소.
        // 4) 항상 원래 종횡비 유지.
        // 5) 게임 + footer 전체를 화면 중앙에 배치.

        const footerHeight = 38;

        // ScreenSettingManager의 현재 선택 목록과 동일.
        const knownUnityResolutions = [
          [1280, 720],
          [1600, 900],
          [1920, 1080],
          [2560, 1440],
          [3840, 2160]
        ];

        // Unity의 기본값과 동일.
        let requestedUnityWidth = 1920;
        let requestedUnityHeight = 1080;

        let applyingCanvasSize = false;

        function isKnownUnityResolution(width, height) {
          return knownUnityResolutions.some(
            ([w, h]) => w === width && h === height
          );
        }

        function fitUnityCanvasToBrowser() {
          const availableWidth =
            Math.max(1, window.innerWidth);

          const availableHeight =
            Math.max(
              1,
              window.innerHeight - footerHeight
            );

          // 1보다 커지지 않으므로 작은 해상도는 절대 확대하지 않는다.
          const scale = Math.min(
            1,
            availableWidth / requestedUnityWidth,
            availableHeight / requestedUnityHeight
          );

          const displayWidth =
            Math.max(
              1,
              Math.floor(
                requestedUnityWidth * scale
              )
            );

          const displayHeight =
            Math.max(
              1,
              Math.floor(
                requestedUnityHeight * scale
              )
            );

          applyingCanvasSize = true;

          // 실제 WebGL 렌더 타겟도 화면에 표시되는 크기까지만 사용.
          // 2560/3840을 선택해도 작은 브라우저에서는 불필요하게
          // 초고해상도로 렌더링하지 않는다.
          canvas.width = displayWidth;
          canvas.height = displayHeight;

          canvas.style.width =
            displayWidth + "px";

          canvas.style.height =
            displayHeight + "px";

          // 부모의 크기도 정확히 맞춰서 중앙 정렬 시
          // 위/오른쪽으로 한쪽만 남는 현상을 없앤다.
          container.style.width =
            displayWidth + "px";

          container.style.height =
            (displayHeight + footerHeight) + "px";

          applyingCanvasSize = false;
        }

        // Unity의 Screen.SetResolution()이 canvas width/height를 변경하면
        // 그 값을 다음 표시 크기의 기준값으로 기억한다.
        const canvasResolutionObserver =
          new MutationObserver(() => {
            if (applyingCanvasSize)
              return;

            const width = Number(canvas.width);
            const height = Number(canvas.height);

            if (!isKnownUnityResolution(width, height))
              return;

            requestedUnityWidth = width;
            requestedUnityHeight = height;

            fitUnityCanvasToBrowser();
          });

        canvasResolutionObserver.observe(
          canvas,
          {
            attributes: true,
            attributeFilter: ["width", "height"]
          }
        );

        // 빌드 시작 전 초기 크기.
        const initialWidth = Number(canvas.width);
        const initialHeight = Number(canvas.height);

        if (isKnownUnityResolution(
              initialWidth,
              initialHeight
            )) {
          requestedUnityWidth = initialWidth;
          requestedUnityHeight = initialHeight;
        }

        fitUnityCanvasToBrowser();

        window.addEventListener(
          "resize",
          fitUnityCanvasToBrowser
        );
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
